# Developer toolchain for gistui. Run `mise install` to provision everything,
# then `mise run check` before committing. See https://mise.jdx.dev.
#
# Both tools track a moving channel: `rust` follows the stable release, and
# `tcut` follows its latest tag so the demo harness picks up upstream fixes
# without a manual bump. `mise install` re-resolves both.
#
# Note: `gh` is intentionally not pinned here — the shipped app shells out to the
# user's own `gh` at runtime, so it stays a user-provided dependency.

[tools]
rust = { version = "stable", components = "rustfmt,clippy" }
"github:AmanVarshney01/tcut" = "latest"

# Tasks mirror the AGENTS.md verification gate and demo harness so the same
# commands run locally and in CI. List them with `mise tasks`.

[tasks.fmt]
description = "Check formatting (rustfmt)"
run = "cargo fmt --check"

[tasks.lint]
description = "Clippy with warnings denied"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite (locked)"
run = "cargo test --locked"

[tasks.check]
description = "Verification gate — fmt, lint, test, check (all must pass)"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test --locked",
  "cargo check",
]

[tasks.run]
description = "Launch the TUI"
run = "cargo run"

[tasks.demo]
description = "Regenerate all demo media (GIF + still PNGs)"
run = [
  "tcut scripts/demo.video.ts",
  "tcut scripts/demo.stills.ts",
]
