version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment, so every
    # release — patch included — needs a bump here. One grouped PR a week.
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Pinned to the head of its `stable` branch, which has no version tags
      # for Dependabot to follow; refresh by hand with
      # `gh api repos/dtolnay/rust-toolchain/branches/stable --jq .commit.sha`.
      - dependency-name: dtolnay/rust-toolchain
    commit-message:
      prefix: ci
